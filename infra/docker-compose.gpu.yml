# The model servers on an NVIDIA GPU: vLLM for text (ADR-0019), infra/tts for Sara's
# voice (ADR-0018). Layered over the base file:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.gpu.yml \
#     --env-file infra/.env --profile tts up -d
#
# Kept apart from docker-compose.yml because a GPU reservation fails outright on
# a host without the NVIDIA container toolkit, which a developer's laptop
# usually is.

services:
  llm:
    # vLLM's CUDA build, the same release as the CPU one in the base file.
    image: ${LLM_CUDA_IMAGE:-vllm/vllm-openai:v0.10.2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
