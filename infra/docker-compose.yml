name: nova

# What the API and the worker connect with, and nothing more. A service's own
# `environment` replaces a merged mapping wholesale rather than extending it, so
# the containers that also need the schema owner extend this anchor
# (`x-owner-environment`) instead of keeping a copy that could drift.
x-backend-environment: &backend-environment
  # The API and the worker log in as `nova_app`, never as POSTGRES_USER. The
  # `postgres` image makes POSTGRES_USER a superuser, and Postgres exempts a
  # superuser from row-level security even under FORCE, so connecting as it
  # switches every tenant policy off. infra/postgres/initdb gives `nova_app`
  # its login (`make db-app-role` on an older volume); migration e1f2a3b4c5d6
  # grants it the schema.
  DATABASE_URL: postgresql+asyncpg://nova_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is unset, see infra/.env.example}@postgres:5432/${POSTGRES_DB:-nova}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is unset, see infra/.env.example}@redis:6379/0
  # `env_file` hands the process every line of infra/.env, the superuser's
  # password among them. Blanked here, so an API or worker that is compromised
  # cannot read it out of its own environment.
  POSTGRES_PASSWORD: ""
  # Business photos (integrations/storage). In development they live in the
  # bind-mounted source tree, git-ignored, so they survive container rebuilds
  # without a root-owned named volume the non-root app user couldn't write.
  # Production points this at a persistent volume.
  MEDIA_ROOT: /app/.media

# The schema owner, for the two containers that create tables: the one-shot
# `migrate` job and the on-demand `tools` container. Never `backend` or
# `worker`, the processes that serve traffic and run jobs.
x-owner-environment: &owner-environment
  <<: *backend-environment
  # Migrations need the owner, since `nova_app` cannot create a table.
  # alembic/env.py prefers this over DATABASE_URL.
  MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset, see infra/.env.example}@postgres:5432/${POSTGRES_DB:-nova}
  # `make test` runs pytest in `tools`, where conftest.py's localhost default
  # would resolve to the container itself. The owner, because conftest.py
  # migrates the test database and then runs every test as `nova_app` through
  # `SET ROLE`.
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset, see infra/.env.example}@postgres:5432/${POSTGRES_TEST_DB:-nova_test}

# The backend, the worker and the one-shot containers are the same image with
# different commands. Defined once here so the build arguments cannot drift
# apart between them.
x-backend: &backend
  build:
    context: ../nova_backend
    dockerfile: Dockerfile
    # The dev target: bind-mounted source, reload on save, test and lint
    # tooling present so `make test` and `make migrate` work in `tools`.
    # `docker build nova_backend` with no target builds the production image.
    target: dev
    args:
      # The container writes into the bind mount — `alembic revision
      # --autogenerate` produces a file there — so its uid has to match the
      # host's. Set UID/GID in infra/.env if yours is not 1000.
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: nova-backend:dev
  env_file: .env
  environment: *backend-environment
  volumes:
    # Bind mount for reload-on-save. The image keeps its virtualenv at
    # /opt/venv precisely so this mount cannot shadow it.
    #
    # `:z` relabels the tree for SELinux. On an enforcing host (Fedora, RHEL,
    # openSUSE 16) source under a home directory is `user_home_t`, which a
    # container may not read: without it every service sharing this mount
    # dies at start with "Permission denied" on /app. Lowercase `z` is the
    # shared label — `Z` would make it private to one container, and migrate,
    # backend and worker all mount it. A no-op where SELinux is off. Undo
    # with `restorecon -R nova_backend`.
    - ../nova_backend:/app:z

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is unset, see infra/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      # Read by initdb/20-create-app-role.sh: the login for `nova_app`.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is unset, see infra/.env.example}
    ports:
      # Loopback only, like every port this file publishes. On 0.0.0.0 the
      # database answered anyone who could reach this machine: the office LAN,
      # public Wi-Fi, a tailnet. Containers reach it as `postgres` and need no
      # published port at all.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the `nova_test` database and the `nova_app` login on first
      # initialisation. Each file says what to do about an existing volume.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # The backend waits on this rather than sleeping — a race here shows up as
      # a confusing "connection refused" on the first request instead.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: idempotency keys and rate-limit counters are not worth a full
    # RDB snapshot, but losing every one on restart is worse than the disk cost.
    #
    # requirepass: ARQ keeps its job queue here, and a queued job is something
    # the worker executes. The healthcheck's redis-cli authenticates through
    # REDISCLI_AUTH.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is unset, see infra/.env.example}"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is unset, see infra/.env.example}
    ports:
      # Loopback only; see `postgres`.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `up`, before anything can serve a request. Without it the
  # first request after a fresh clone hits an empty database and 500s, and the
  # fix ("now run make migrate") is knowledge you have to already have.
  #
  # A separate service rather than an entrypoint step in the backend, because
  # backend and worker both start at once and two concurrent `alembic upgrade
  # head` runs race each other. This one finishes before either begins.
  migrate:
    <<: *backend
    # A one-shot job. `unless-stopped` would restart it forever on exit 0.
    restart: "no"
    environment: *owner-environment
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      # Loopback only; see `postgres`. The tunnel reaches the backend over the
      # compose network, not through this port.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    # Same image, different entrypoint: the ARQ worker drains the transactional
    # outbox and runs scheduled jobs. Without it, domain events are written and
    # never delivered, and notifications are composed and never sent.
    <<: *backend
    restart: unless-stopped
    command: ["arq", "app.worker.arq_worker.WorkerSettings"]
    # The image's healthcheck probes an HTTP port this process does not open.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # SvelteKit (Svelte 5), dev target: `vite dev` reloads on save, same as the
  # backend's bind-mounted dev image. Never given `env_file: .env` — that file
  # carries the schema owner's password and SECRET_KEY, and this container has
  # no use for either; see the backend's own note about POSTGRES_PASSWORD above.
  frontend:
    build:
      context: ../nova-frontend
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: nova-frontend:dev
    restart: unless-stopped
    environment:
      # The browser, not this container, makes these requests — so this has
      # to be an origin the host can reach, never a compose service name.
      PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      # Loopback only; see `postgres`.
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Bind mount for reload-on-save, `:z` for the same SELinux reason as the
      # backend's.
      - ../nova-frontend:/app:z
      # Keeps the image's own node_modules — built for linux/glibc, matching
      # this container — from being shadowed by the host tree the mount above
      # brings in. The Node equivalent of the backend's venv-outside-/app trick.
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # On demand and never started by `up`: `docker compose run --rm tools
  # <command>`, which is what `make test`, `make migrate` and `make revision`
  # do. It holds the schema owner's credentials, so it lives only as long as
  # one of those commands.
  tools:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    environment: *owner-environment
    command: ["true"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # Nothing is published beyond loopback: the tunnel dials out to Cloudflare
  # and traffic arrives over that connection (docs/01, docs/09 #15). Runs only
  # when a token is configured, so `make dev` works offline without one. The
  # API refuses to start with AUTH_DEV_BYPASS on while the token is set, so the
  # tunnel cannot publish an API that needs no token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN}",
      ]
    depends_on:
      # Waits for the backend to actually answer, not merely to have started —
      # otherwise the tunnel comes up first and the public URL 502s.
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
