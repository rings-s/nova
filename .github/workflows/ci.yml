name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.5"
  PNPM_VERSION: "9"

jobs:
  # The frontend is not always present in the tree (it currently is not). Gating
  # the two frontend jobs on this keeps them defined and ready rather than
  # deleting them, while stopping CI failing red over a directory that is
  # legitimately absent.
  detect-components:
    name: detect components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend-lint:
    name: backend / lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check app tests

  backend-typecheck:
    name: backend / type check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run mypy app

  backend-migrations:
    name: backend / migrations apply cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # alembic/env.py loads Settings, so every required field must be present
      # even though only the database is contacted.
      DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-migrations-not-a-real-secret
      # Settings defaults ENV to production, which refuses a key this short.
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # Every migration must apply cleanly to an empty database, in order — this is what
      # actually happens on deploy. `alembic check` also catches model/migration drift
      # (an autogenerate diff that was never turned into a migration).
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  backend-tests:
    name: backend / tests (pytest)
    runs-on: ubuntu-latest
    needs: [backend-migrations]
    defaults:
      run:
        working-directory: nova_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/conftest.py reads TEST_DATABASE_URL directly and applies migrations itself
      # against it — no separate migration step needed here.
      TEST_DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest -q

  backend-import-smoke:
    name: backend / build (import smoke check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova_backend
    env:
      # `create_app()` reads Settings, which requires these. No database is
      # contacted — the engine is created lazily — but the values must parse.
      DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-smoke-check-not-a-real-secret
      # Settings defaults ENV to production, which refuses a placeholder key.
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # No compiled build artifact for a FastAPI app — the equivalent "does this actually
      # build" check is that the app assembles: every module's router/models import cleanly
      # and app.main.create_app() wires them without error.
      - run: uv run python -c "from app.main import create_app; create_app()"

  frontend-check:
    name: frontend / type check (svelte-check)
    runs-on: ubuntu-latest
    needs: [detect-components]
    if: needs.detect-components.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  frontend-build:
    name: frontend / build
    runs-on: ubuntu-latest
    needs: [detect-components, frontend-check]
    if: needs.detect-components.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
