[project]
name = "nova-backend"
version = "0.1.0"
description = "NOVA backend — FastAPI vertical-slice API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # Depends()/Path() in argument defaults is the standard FastAPI DI pattern
    "UP046",  # Generic[T] base class kept for clarity/compatibility over PEP 695 syntax
    "RUF012", # ARQ's WorkerSettings requires plain mutable class attributes
]
