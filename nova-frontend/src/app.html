<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Sets the `.dark` class before first paint, so there's no flash of
			// the wrong theme. Mirrors `$lib/stores/theme.svelte.js`'s resolution
			// order (stored choice, else OS preference) — kept in plain JS here
			// since it must run before any module script loads.
			(function () {
				try {
					var stored = localStorage.getItem('nova.theme');
					var dark =
						stored === 'dark' ||
						(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		<title>NOVA</title>
		<meta
			name="description"
			content="GCC-focused AI booking and customer operations platform for wellness and beauty centers"
		/>
		<meta property="og:title" content="NOVA" />
		<meta
			property="og:description"
			content="GCC-focused AI booking and customer operations platform for wellness and beauty centers"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
